[package]
name = "keyvault"
version = "0.1.0"
edition = "2021"
description = "Lightweight cross-platform key/secret/command vault"
authors = ["Prafull"]

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
directories = "5"
arboard = "3"
regex = "1"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
rfd = "0.15"
egui_commonmark = "0.18"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
